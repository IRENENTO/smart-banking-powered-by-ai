version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file: ./backend/.env
    environment:
      - NODE_ENV=production
      - AI_ENGINE_URL=http://ai-engine:8000/api/ai
    depends_on:
      ai-engine:
        condition: service_started
    restart: unless-stopped

  ai-engine:
    build: ./ai-engine
    ports:
      - "8000:8000"
    environment:
      - AI_ENGINE_API_KEY=${AI_ENGINE_API_KEY:-dev-key-change-in-production}
      - ALLOWED_ORIGINS=http://localhost:5000
    restart: unless-stopped

  payment:
    build: ./payment
    ports:
      - "8001:8000"
    env_file: ./payment/.env
    restart: unless-stopped

volumes:
  mysql_data:
