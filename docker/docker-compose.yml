version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: sentinel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-sentinel123}
      MYSQL_DATABASE: sentinel_ai
      MYSQL_USER: sentinel
      MYSQL_PASSWORD: ${DB_PASSWORD:-sentinel123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../packages/backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../packages/backend
      dockerfile: ../../docker/Dockerfile.backend
    container_name: sentinel-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: sentinel_ai
      DB_USER: sentinel
      DB_PASSWORD: ${DB_PASSWORD:-sentinel123}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    volumes:
      - backend_uploads:/app/uploads

  admin:
    build:
      context: ../packages/admin
      dockerfile: ../../docker/Dockerfile.admin
    container_name: sentinel-admin
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:4000/api
    ports:
      - "3000:3000"

volumes:
  mysql_data:
  redis_data:
  backend_uploads:
