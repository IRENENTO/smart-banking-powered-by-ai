services:
  - type: web
    name: ai-banking-api
    env: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AI_ENGINE_URL
        sync: false
      - key: AI_ENGINE_API_KEY
        sync: false
      - key: PAYPACK_CLIENT_ID
        sync: false
      - key: PAYPACK_CLIENT_SECRET
        sync: false
      - key: PAYPACK_BASE_URL
        value: https://payments.paypack.rw/api
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
