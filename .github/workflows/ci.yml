name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Web — Install
        working-directory: ./web
        run: npm ci --legacy-peer-deps
      - name: Web — Build
        working-directory: ./web
        run: npm run build
      - name: Backend — Install
        working-directory: ./backend
        run: npm ci
      - name: Backend — Lint placeholder
        working-directory: ./backend
        run: node -e "require('./src/server.js')" 2>&1 | head -5 || true

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: smart_banking_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Backend — Install & Test
        working-directory: ./backend
        run: |
          npm ci
          npm test || echo "No tests yet"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t backend ./backend
      - name: Build AI Engine image
        run: docker build -t ai-engine ./ai-engine
      - name: Build payment image
        run: docker build -t payment ./payment
